name: Prepare evidence review labels

on:
  push:
    branches: [main]
    paths: ['.github/workflows/evidence-labels.yml']
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: evidence-review-label-setup
  cancel-in-progress: false

jobs:
  prepare-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Create missing review labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          if repository != 'hgw3lls/uptight':
              raise SystemExit('This label setup belongs to hgw3lls/uptight.')
          endpoint = 'https://api.github.com/repos/' + repository + '/labels'
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }
          labels = [
              ('evidence:received', 'B3AA92', 'Public evidence received; no research assessment is implied.'),
              ('evidence:under-review', '1F5A96', 'A maintainer is reviewing the supporting evidence.'),
              ('evidence:incorporated', 'F2C919', 'A maintainer has incorporated the evidence into the research record.'),
              ('evidence:disputed', 'C8321F', 'A maintainer has recorded an unresolved challenge to this evidence.'),
          ]
          for name, color, description in labels:
              url = endpoint + '/' + urllib.parse.quote(name, safe='')
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=15) as response:
                      response.read()
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
              else:
                  print('Already available: ' + name)
                  continue
              payload = json.dumps({'name': name, 'color': color, 'description': description}).encode()
              request = urllib.request.Request(endpoint, data=payload, headers=headers, method='POST')
              with urllib.request.urlopen(request, timeout=15) as response:
                  result = json.load(response)
              if result.get('name') != name:
                  raise SystemExit('GitHub did not confirm the expected label.')
              print('Created: ' + name)
          PY
